spring:
  application:
    name: usermanagement

jwt:
  header: Authorization
  headerPrefix: Bearer
  secret: ${JWT_SECRET_KEY}
  expiration: 3600000

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug
    org.springframework.security: DEBUG                    # ✅ 추가
    multiagentbaseddevelopersupportsystem.security: DEBUG  # ✅ 추가
    org.springframework.web.filter: DEBUG                  # ✅ 추가

---
server:
  port: 8082

spring:
  profiles: default

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  springdoc:
    swagger-ui:
      path: /swagger-ui
    api-docs:
      path: /v3/api-docs  

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde

      bindings:
        event-in:
          group: usermanagement
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
        event-out:
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json

---
server:
  port: 8080

spring:
  profiles: docker

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AZURE_MYSQL_URL}
    username: ${AZURE_MYSQL_USERNAME}
    password: ${AZURE_MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      
  jpa:
    hibernate:
      ddl-auto: validate  
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    database: mysql
        
  data:
    redis:
      host: ${REDIS_HOST:my-redis-master}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
 
  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde

      bindings:
        event-in:
          group: usermanagement
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
        event-out:
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
    
    management:
      endpoints:
        web:
          exposure:
            include: "health"
          base-path: /management   
      endpoint:
        health:
          show-details: when-authorized
          show-components: when-authorized
      security:
        enabled: true



