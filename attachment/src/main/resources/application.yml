# ⛔️ 맨 위 이건 지웁시다
# server:
#   port: 8080

spring:
  application:
    name: attachment
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

---

spring:
  profiles: default
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: attachment
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
        event-out:
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json

  # ✅ 기본 프로필에서 Azure 자동설정 비활성화 (이거 중요)
  autoconfigure:
    exclude: com.azure.spring.autoconfigure.storage.StorageAutoConfiguration

file:
  storage:
    type: local
    local-path: ./uploads/      # ✅ 키 이름 local-path 로

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug

server:
  port: 8091   # ✅ 기본 프로필 포트는 8091만 유지

---

spring:
  profiles: docker

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AZURE_MYSQL_URL:jdbc:mysql://your-mysql-server.mysql.database.azure.com:3306/attachment_db?useSSL=true&requireSSL=true&serverTimezone=UTC}
    username: ${AZURE_MYSQL_USERNAME:your-username}
    password: ${AZURE_MYSQL_PASSWORD:your-password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    database: mysql

  cloud:
    stream:
      kafka:
        binder:
          brokers: my-kafka:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: attachment
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
        event-out:
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json

# ✅ docker 프로필에서만 Azure 설정/사용
azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME}
    account-key: ${AZURE_STORAGE_ACCOUNT_KEY}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:attachments}
    endpoint: https://${azure.storage.account-name}.blob.core.windows.net

file:
  storage:
    type: azure
