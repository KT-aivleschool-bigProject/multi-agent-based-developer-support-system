spring:
  application:
    name: attachment
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

logging:
  level:
    org.hibernate.type: trace
    org.springframework.cloud: debug

---
server:
  port: 8091

spring:
  profiles: default
  autoconfigure:
    exclude:
      - com.azure.spring.autoconfigure.storage.blob.BlobStorageAutoConfiguration
      - com.azure.spring.autoconfigure.storage.StorageAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: attachment
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
        event-out:
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json

file:
  storage:
    type: local
    path: ./uploads/

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

aiagent:
  base-url: http://localhost:8000        # FastAPI 주소(로컬)

post:
  base-url: http://localhost:8090        # Post 서비스 내부 호출 주소(로컬)

attachment:
  public-base-url: http://localhost:8091 # FastAPI가 파일을 다운로드할 Attachment 주소(로컬)

security:
  internal-token: ""                     # 내부 호출 보호 토큰(사용 시 값 세팅)


---
server:
  port: 8080

spring:
  profiles: docker

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AZURE_MYSQL_URL}
    username: ${AZURE_MYSQL_USERNAME}
    password: ${AZURE_MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      
  jpa:
    hibernate:
      ddl-auto: validate  
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    database: mysql

  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092
        streams:
          binder:
            configuration:
              default:
                key:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
                value:
                  serde: org.apache.kafka.common.serialization.Serdes$StringSerde
      bindings:
        event-in:
          group: attachment
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
        event-out:
          destination: multiagentbaseddevelopersupportsystem
          contentType: application/json
    management:
      endpoints:
        web:
          exposure:
            include: "health"
          base-path: /management   
      endpoint:
        health:
          show-details: when-authorized
          show-components: when-authorized
      security:
        enabled: true      
azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME}
    account-key: ${AZURE_STORAGE_ACCOUNT_KEY}
    container-name: ${AZURE_STORAGE_CONTAINER_NAME}

file:
  storage:
    type: azure
    max-file-size: 100MB        
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,mp4,avi,mov
    path-prefix: uploads/       
    public-access: false       
    cdn-enabled: true          

aiagent:
  base-url: http://fastapi:8000

post:
  base-url: http://post:8080

attachment:
  public-base-url: http://attachment:8080

 

