apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectmanagement
  labels:
    app: projectmanagement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projectmanagement
  template:
    metadata:
      labels:
        app: projectmanagement
    spec:
      containers:
        - name: projectmanagement
          image: "bigproject.azurecr.io/projectmanagement:prod"
          env:
            - name: AZURE_MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: url
            - name: AZURE_MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: AZURE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: '/management/health/readiness'
              port: 8080
            initialDelaySeconds: 20
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: '/management/health/liveness'
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
