apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectmanagement
  labels:
    app: projectmanagement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projectmanagement
  template:
    metadata:
      labels:
        app: projectmanagement
    spec:
      containers:
        - name: projectmanagement
          image: "bigproject.azurecr.io/projectmanagement:v1"
          ports:
            - containerPort: 8080
          env:
            # docker 프로파일 사용
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            # MySQL (attachment와 동일 패턴)
            - name: AZURE_MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: url
            - name: AZURE_MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: AZURE_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password

            # Azure Storage - attachment 스타일(계정/키/컨테이너)
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: azure-storage-account-name
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: azure-storage-account-key
            - name: AZURE_STORAGE_CONTAINER_NAME
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: azure-storage-container-name

          readinessProbe:
            httpGet:
              path: /management/health   
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /management/health
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 5
